# Compaction controller comparison: CPU-bound write-heavy workload, controller v1.
#
# Companion to the write-heavy jobs, comparing the backlog-based controller (v1) with
# the rate-matching controller (v2). Scylla comes from a BYO build of
# raphaelsc/scylla (or the AMI baked from it); the controller is selected through
# scylla.yaml.
#
# Why a second write-heavy job: with 1 KB rows the write-heavy node is disk-bound.
# In the 24 h runs of 2026-11-17 the disk carried ~180 MB/s of writes and ~190 MB/s
# of reads, compaction I/O waited 37-49 ms in the queue, and halving the compaction
# shares of a shard (540 -> 280) cost only ~11% of its compaction throughput. There,
# shares mostly move I/O queue time between compaction and queries. This job shrinks
# the rows so the per-row CPU cost (CQL, memtable, merging rows in compaction) is
# the bottleneck and the disk has headroom: shares then buy compaction, which tests
# whether a controller raises shares when they pay off. The disk-bound write-heavy
# job stays as the other case.
#
# Cluster: 1 DB node (i8g.large), RF 1, 1 loader (c6i.4xlarge), 1 monitor, no nemesis.
# Same DB node as the other jobs, so the v1 normalization factor of 13 still holds
# and the results compare with the earlier rounds. The loader is larger than the
# write-heavy job's c6i.xlarge: small rows mean more operations per second, and the
# c6i.xlarge capped the adversarial job's first run at 91-99% loader CPU.
# Stress:
#   rows:    1 column of 100 B (~150 B per row with key and overhead) instead of
#            4 x 256 B, ~6-7x fewer bytes per write for the same row count.
#   prepare: 150M rows written once (~22 GB, ~1.4x the node's RAM, the same logical
#            size as the 25M x 1 KB of the write-heavy job, so reads still miss
#            cache). 400 threads, the rate is not known yet; at 45-60K rows/s it
#            takes 40-55 min.
#   stress:  4 h of cassandra-stress mixed, 95% writes / 5% reads, NOT throttled,
#            200 threads, uniform key distribution over the populated range so
#            reads miss cache.
#
# How to tell the load is right (check before comparing v1 and v2):
#   - reactor at 95-100% on both shards;
#   - disk clearly below saturation and compaction I/O queue delay far below the
#     37-49 ms of the disk-bound job;
#   - compaction throughput follows shares (doubling shares buys ~50% or more).
#
# Disk: the logical set matches the write-heavy job, so the live size should settle
# in the same 150-225 GB range (6-8x the logical set). Small rows carry more
# per-row overhead (index, bloom filter) than 1 KB rows, so it may land higher; the
# 468 GB NVMe leaves room. Bloom filters for ~150M keys x 6-8 versions take ~1-1.5 GB
# of the 16 GB of RAM.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

test_duration: 400
test_metadata:
  description: >-
    Compaction controller comparison, CPU-bound write-heavy workload (95% writes / 5%
    reads, 100 B rows) with controller v1 selected via scylla.yaml. ScyllaDB build on
    a single small node, RF 1, ICS table, 150M-row population then 4 hours of
    unthrottled cassandra-stress mixed load with a uniform key distribution. Small
    rows keep the DB CPUs saturated with the disk below its limit, so compaction
    only gets the CPU its shares allow. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: write

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8g.large'
instance_type_loader: 'c6i.4xlarge'

user_prefix: 'cc-wh-cpu-v1-4h'

nemesis_class_name: 'NoOpMonkey'
# Scylla Manager is not used (no nemesis, no repair or backup). Off so setup does not
# depend on fetching its apt key from keyserver.ubuntu.com, which failed every build
# on 2026-11-11, and so no agent runs beside the reactor being measured.
use_mgmt: false

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v1
  # ICS compacts any tier of 2 runs when none holds min_threshold (4) runs unless this is
  # set, and both controllers count only the tiers at min_threshold. Enforced, as in the
  # other write-heavy jobs, so both shards compact the same way and the controllers see
  # all the work the strategy does; the schema stays at the default 4.
  compaction_enforce_min_threshold: true
  # v1 reaches its maximum shares at a normalized backlog of this factor (backlog over
  # the shard's memory; default 30). This node is 468 GB over 16 GiB, 29:1, where the
  # tree never stages a backlog of 30x the memory; a 69:1 disk-to-memory node, the ratio
  # the controllers are designed for, sees 69/29 = 2.4x the normalized backlog for the
  # same share of its disk. 30 x 29 / 69 = 13 makes v1 react here as it does there,
  # the same factor in every v1 job of the comparison.
  compaction_normalization_factor: 13

# Scylla command line: the SCT defaults (setting append_scylla_args replaces them)
# plus debug logging of the compaction rate/controller logger, so the per-minute
# controller decisions are in the DB logs next to the metrics.
append_scylla_args: >-
  --blocked-reactor-notify-ms 25 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc
  --abort-on-internal-error 1 --abort-on-ebadf 1 --enable-sstable-key-validation 1
  --logger-log-level compaction_rates=debug

# One tablet replica per shard. i8g.large has 2 vCPUs, so 2 shards; one node with RF 1 gives
# 2 tablet replicas of ~11 GB each, one per shard.
# min/max_tablet_count pin the count, so the table growing past the 5 GB default
# tablet size never triggers a split, which would double the compaction groups
# the controller sees. cassandra-stress uses CREATE ... IF NOT EXISTS, so this
# pre-created schema wins over the one in its -schema option. The table keeps the
# standard cassandra-stress columns; with -col n=FIXED(1) only C0 is written.
pre_create_keyspace:
  - "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1} AND tablets = {'initial': 2};"
  - "CREATE TABLE IF NOT EXISTS keyspace1.standard1 (key blob PRIMARY KEY, \"C0\" blob, \"C1\" blob, \"C2\" blob, \"C3\" blob) WITH compaction = {'class': 'IncrementalCompactionStrategy'} AND tablets = {'min_tablet_count': '2', 'max_tablet_count': '2'};"

prepare_write_cmd: >-
  cassandra-stress write no-warmup cl=ONE n=150000000
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=400
  -pop seq=1..150000000
  -col 'n=FIXED(1) size=FIXED(100)'
  -log interval=5

stress_cmd: >-
  cassandra-stress mixed no-warmup cl=ONE duration=240m 'ratio(write=19,read=1)'
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=200
  -pop 'dist=UNIFORM(1..150000000)'
  -col 'n=FIXED(1) size=FIXED(100)'
  -log interval=5

round_robin: true
