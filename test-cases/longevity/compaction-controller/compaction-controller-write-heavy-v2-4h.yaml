# Compaction controller comparison: write-heavy workload, controller v2.
#
# One of six jobs (3 workloads x 2 controllers) comparing the backlog-based
# controller (v1) with the rate-matching controller (v2). Scylla comes from a
# BYO build of raphaelsc/scylla branch experiment/closed-loop-demo (or the AMI
# baked from it); the controller is selected through scylla.yaml.
#
# Cluster: 3 DB nodes (i8g.large), 1 loader, 1 monitor, no nemesis.
# Stress:
#   prepare: 50M rows of 1 KB written once (~150 GB with RF 3, ~23 min at the
#            ~36K ops/s a c6i.large loader with 50 threads delivered to this cluster)
#   stress:  4 h of cassandra-stress mixed, 95% writes / 5% reads, NOT throttled, 200 threads
#            from a c6i.xlarge loader, uniform key distribution over the populated
#            range so reads miss cache.
#
# The query load must leave no spare CPU. Seastar's scheduler is work conserving:
# idle CPU goes to compaction whatever shares the controller set, and then v1 and
# v2 would be indistinguishable. Check scylla_reactor_utilization is ~100% on every
# shard in the first minutes of the stress phase; if not, raise threads or add a
# loader before trusting the results.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

test_duration: 320
test_metadata:
  description: >-
    Compaction controller comparison, write-heavy workload (95% writes / 5% reads) with
    controller v2 selected via scylla.yaml. BYO ScyllaDB build on a 3-node cluster of
    small instances, ICS table, 50M-row population then 4 hours of unthrottled
    cassandra-stress mixed load with a uniform key distribution that keeps the DB CPUs saturated,
    so compaction only gets the CPU its shares allow. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: write

n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8g.large'
instance_type_loader: 'c6i.xlarge'

user_prefix: 'cc-write-heavy-v2'

nemesis_class_name: 'NoOpMonkey'

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v2

prepare_write_cmd: >-
  cassandra-stress write no-warmup cl=QUORUM n=50000000
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=50
  -pop seq=1..50000000
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

stress_cmd: >-
  cassandra-stress mixed no-warmup cl=QUORUM duration=240m 'ratio(write=19,read=1)'
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=200
  -pop 'dist=UNIFORM(1..50000000)'
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

round_robin: true
