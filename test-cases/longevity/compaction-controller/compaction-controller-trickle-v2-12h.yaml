# Compaction controller comparison: trickle-write workload, controller v2.
#
# One of six jobs (3 workloads x 2 controllers) comparing the backlog-based
# controller (v1) with the rate-matching controller (v2). Scylla comes from a
# BYO build of raphaelsc/scylla branch v2-work-over-deadline (or the AMI
# baked from it); the controller is selected through scylla.yaml.
#
# Cluster: 1 DB node (i8g.large), RF 1, 1 loader, 1 monitor, no nemesis.
# A single node is enough: the controller is per shard, and 12 hours of steady
# load is there to show the integrator does not wind up over time.
# Stress:
#   prepare: 150M rows of 1 KB written once (~150 GB, 9x the node's RAM; ~55 min at the
#            ~45K rows/s per node measured in the 12 h runs). The size matters: v1's
#            share curve has its knee at a normalized backlog of 1.5 (backlog over shard
#            memory) and with 50 GB the top-tier merges never reached it, so v1 never
#            burst and the two controllers could not be told apart (rounds of 2026-11-08
#            and 2026-11-09).
#   stress:  12 h of two concurrent cassandra-stress commands:
#            - write: new keys only (a sequence above the populated range), throttled
#              to 1000/s, ~1 MB/s, which is what the 5%/95% mixed command delivered.
#              No overwrites: in the 12 h runs the overwritten keys spread over the
#              sstables and the read rate drifted from 25K/s to 17K/s under both
#              controllers, hiding the controller's effect on the reads.
#            - read: unthrottled, 400 threads, uniform over the populated range so
#              reads miss cache. About 4% writes / 96% reads by count.
#
# The query load must leave no spare capacity. Seastar's schedulers are work
# conserving: idle CPU or disk goes to compaction whatever shares the controller
# set, and then v1 and v2 are indistinguishable. In the first hour of the stress
# phase check, on both shards, that scylla_reactor_utilization is ~100% or the I/O
# queue is saturated (compaction-class scylla_io_queue_delay climbing); if neither,
# raise the read threads before trusting the results. 200 threads left the reactors
# at 90% in the 12 h runs, hence 400.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

test_duration: 840
test_metadata:
  description: >-
    Compaction controller comparison, trickle-write workload (~1000 new-key writes/s
    against unthrottled reads, ~4% / 96%) with controller v2 selected via scylla.yaml.
    BYO ScyllaDB build on a single small node, RF 1, ICS table, 150M-row population
    then 12 hours of a throttled new-key write stream plus a saturating uniform read
    stream, so compaction only gets the capacity its shares allow. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: read

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8g.large'
instance_type_loader: 'c6i.xlarge'

user_prefix: 'cc-trickle-v2'

nemesis_class_name: 'NoOpMonkey'

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v2

# Scylla command line: the SCT defaults (setting append_scylla_args replaces them)
# plus debug logging of the compaction rate/controller logger, so the per-minute
# controller decisions are in the DB logs next to the metrics.
append_scylla_args: >-
  --blocked-reactor-notify-ms 25 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc
  --abort-on-internal-error 1 --abort-on-ebadf 1 --enable-sstable-key-validation 1
  --logger-log-level compaction_rates=debug

# One tablet replica per shard. i8g.large has 2 vCPUs, so 2 shards; one node with RF 1 gives
# 2 tablet replicas of ~75 GB each, one per shard.
# min/max_tablet_count pin the count, so the table growing past the 5 GB default
# tablet size never triggers a split, which would double the compaction groups
# the controller sees. cassandra-stress uses CREATE ... IF NOT EXISTS, so this
# pre-created schema wins over the one in its -schema option.
# min_threshold 2, in the trickle jobs only: at ~1 MB/s of writes no tier ever reached
# the default threshold of 4 in the 12 h runs of 2026-11-10; ICS compacted pairs on
# spare capacity (compaction_enforce_min_threshold is off by default) and both
# controllers, which count only the tiers at min_threshold, saw nothing to do, so v1
# had nothing to burst on outside the post-prepare drain. With the schema at 2 every
# pair is a tier at threshold: the strategy and the controllers agree, and v1's bursts
# on the top-tier merges show up within the run. The moderate and write-heavy jobs
# keep the default: their tiers reach 4 runs on their own.
pre_create_keyspace:
  - "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1} AND tablets = {'initial': 2};"
  - "CREATE TABLE IF NOT EXISTS keyspace1.standard1 (key blob PRIMARY KEY, \"C0\" blob, \"C1\" blob, \"C2\" blob, \"C3\" blob) WITH compaction = {'class': 'IncrementalCompactionStrategy', 'min_threshold': '2'} AND tablets = {'min_tablet_count': '2', 'max_tablet_count': '2'};"

prepare_write_cmd: >-
  cassandra-stress write no-warmup cl=ONE n=150000000
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=50
  -pop seq=1..150000000
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

stress_cmd:
  - >-
    cassandra-stress write no-warmup cl=ONE duration=720m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=10 throttle=1000/s
    -pop seq=150000001..200000000
    -col 'n=FIXED(4) size=FIXED(256)'
    -log interval=5
  - >-
    cassandra-stress read no-warmup cl=ONE duration=720m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=400
    -pop 'dist=UNIFORM(1..150000000)'
    -col 'n=FIXED(4) size=FIXED(256)'
    -log interval=5

round_robin: true
