# Compaction controller comparison: moderate-write workload, controller v2.
#
# One of six jobs (3 workloads x 2 controllers) comparing the backlog-based
# controller (v1) with the rate-matching controller (v2). Scylla comes from a
# BYO build of raphaelsc/scylla branch v2-work-over-deadline (or the AMI
# baked from it); the controller is selected through scylla.yaml.
#
# Cluster: 1 DB node (i8g.large), RF 1, 1 loader, 1 monitor, no nemesis.
# A single node is enough: the controller is per shard, and 12 hours of steady
# load is there to show the integrator does not wind up over time.
# Stress:
#   prepare: 50M rows of 1 KB written once (~50 GB, 3x the node's RAM; ~19 min at the
#            ~45K rows/s per node measured in the 12 h runs)
#   stress:  12 h of cassandra-stress mixed, 40% writes / 60% reads, NOT throttled,
#            400 threads from a c6i.xlarge loader, uniform key distribution over the
#            populated range so reads miss cache. 200 threads left the reactors at
#            74-88% in the 12 h runs: the reads wait on the disk, and the I/O queue,
#            not the CPU, was the contended resource.
#
# The query load must leave no spare capacity. Seastar's schedulers are work
# conserving: idle CPU or disk goes to compaction whatever shares the controller
# set, and then v1 and v2 are indistinguishable. In the first hour of the stress
# phase check, on both shards, that scylla_reactor_utilization is ~100% or the I/O
# queue is saturated (compaction-class scylla_io_queue_delay climbing); if neither,
# raise the threads before trusting the results.
# Throughput drifts for the first 3-4 hours (reads 15K/s to 8K/s) while the
# overwrite workload settles and the tree deepens; compare runs from hour 4 on.
# v1 shows its bursts here at the default normalization factor (35 excursions above
# 200 shares in 12 h, read p99 80-123 ms inside them against 53 ms), so the factor
# is left at its default.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

test_duration: 780
test_metadata:
  description: >-
    Compaction controller comparison, moderate-write workload (40% writes / 60% reads) with
    controller v2 selected via scylla.yaml. BYO ScyllaDB build on a single small
    node, RF 1, ICS table, 50M-row population then 12 hours of unthrottled
    cassandra-stress mixed load (400 threads) with a uniform key distribution that saturates
    the node, so compaction only gets the capacity its shares allow. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8g.large'
instance_type_loader: 'c6i.xlarge'

user_prefix: 'cc-moderate-v2'

nemesis_class_name: 'NoOpMonkey'

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v2

# Scylla command line: the SCT defaults (setting append_scylla_args replaces them)
# plus debug logging of the compaction rate/controller logger, so the per-minute
# controller decisions are in the DB logs next to the metrics.
append_scylla_args: >-
  --blocked-reactor-notify-ms 25 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc
  --abort-on-internal-error 1 --abort-on-ebadf 1 --enable-sstable-key-validation 1
  --logger-log-level compaction_rates=debug

# One tablet replica per shard. i8g.large has 2 vCPUs, so 2 shards; one node with RF 1 gives
# 2 tablet replicas of ~25 GB each, one per shard.
# min/max_tablet_count pin the count, so the table growing past the 5 GB default
# tablet size never triggers a split, which would double the compaction groups
# the controller sees. cassandra-stress uses CREATE ... IF NOT EXISTS, so this
# pre-created schema wins over the one in its -schema option.
pre_create_keyspace:
  - "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1} AND tablets = {'initial': 2};"
  - "CREATE TABLE IF NOT EXISTS keyspace1.standard1 (key blob PRIMARY KEY, \"C0\" blob, \"C1\" blob, \"C2\" blob, \"C3\" blob) WITH compaction = {'class': 'IncrementalCompactionStrategy'} AND tablets = {'min_tablet_count': '2', 'max_tablet_count': '2'};"

prepare_write_cmd: >-
  cassandra-stress write no-warmup cl=ONE n=50000000
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=50
  -pop seq=1..50000000
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

stress_cmd: >-
  cassandra-stress mixed no-warmup cl=ONE duration=720m 'ratio(write=2,read=3)'
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=400
  -pop 'dist=UNIFORM(1..50000000)'
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

round_robin: true
