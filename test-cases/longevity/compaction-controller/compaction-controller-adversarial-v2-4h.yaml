# Compaction controller comparison: adversarial write/read cycles, controller v2.
#
# Avi's adversarial case for controller v2: 15 minutes of ingestion followed by 15 minutes
# of reads. Nothing is learned in the 15 minutes of writes, so they leave the data
# uncompacted; when the reads start, the urgency is high and the shares rise quickly, so
# the reads start slow (medium-size partitions with a row in every sstable) and improve as
# compaction catches up. The job measures how slow the reads start and how fast they
# recover, under v1 and under v2.
#
# Cluster: 1 DB node (i8ge.large), RF 1, 1 loader, 1 monitor, no nemesis.
# i8ge.large, not the i8g.large of the steady-state jobs: the same Graviton4 2 vCPUs and
# 16 GiB, so the same arm64 AMI, but a 1250 GB NVMe. Eight write phases of up to ~70 GB
# each are up to ~560 GB written; with no compaction at all that would not fit 468 GB.
# Phases, run one after the other by compaction_controller_test.test_write_read_cycles:
#   8 cycles of
#   - write: 15 min of cassandra-stress user mode, NOT throttled, 200 threads, batches of
#     10 random rows of one random partition (data_dir/cs_compaction_controller_adversarial.yaml):
#     50,000 partitions of 2,000 rows of ~1 KB, 2 MB each, ~100 GB in all. Every phase
#     overwrites rows of the same partitions, so the live data stays bounded at ~100 GB.
#   - read: 15 min of point reads (partition and row), NOT throttled, 400 threads, uniform
#     over the partitions. Each write phase spreads every partition over every sstable it
#     flushes, so a point read touches every sstable holding the partition.
# The first cycle is the case as Avi stated it: an empty table, no history. Later cycles
# show whether the controllers carry anything from one cycle to the next, and whether a
# backlog builds up across cycles.
# Avi's estimate was 40 MB/s per shard of ingest; the node gives what it gives, unthrottled.
#
# What to compare: read throughput and p99 over each read phase (the first minutes, and
# the time to recover), live sstables and sstables per read at the start and end of each
# read phase, the shares in both phases, and the write rate. The compaction_rates log (v2)
# has the urgency and the decisions minute by minute.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

# 8 x 30 min of phases + setup and teardown.
test_duration: 300
test_metadata:
  description: >-
    Compaction controller comparison, adversarial workload with controller v2 selected via
    scylla.yaml: 8 cycles of 15 minutes of unthrottled writes spreading medium-size partitions
    over every sstable, then 15 minutes of unthrottled point reads. BYO ScyllaDB build on a
    single small node, RF 1, ICS table. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8ge.large'
instance_type_loader: 'c6i.xlarge'

user_prefix: 'cc-adversarial-v2-4h'

nemesis_class_name: 'NoOpMonkey'
# Scylla Manager is not used (no nemesis, no repair or backup), and no agent runs beside
# the reactor being measured.
use_mgmt: false

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v2
  # As in the write-heavy and moderate jobs: enforced so both shards compact the same way
  # and the controllers see all the work the strategy does; the schema stays at the default 4.
  compaction_enforce_min_threshold: true

# Scylla command line: the SCT defaults (setting append_scylla_args replaces them)
# plus debug logging of the compaction rate/controller logger, so the per-minute
# controller decisions are in the DB logs next to the metrics.
append_scylla_args: >-
  --blocked-reactor-notify-ms 25 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc
  --abort-on-internal-error 1 --abort-on-ebadf 1 --enable-sstable-key-validation 1
  --logger-log-level compaction_rates=debug

# One tablet replica per shard. i8ge.large has 2 vCPUs, so 2 shards; one node with RF 1 gives
# 2 tablet replicas of ~50 GB each, one per shard. min/max_tablet_count pin the count, so the
# table growing past the 5 GB default tablet size never triggers a split, which would double
# the compaction groups the controller sees. The profile's CREATE ... IF NOT EXISTS then
# leaves this schema as it is.
pre_create_keyspace:
  - "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1} AND tablets = {'initial': 2};"
  - "CREATE TABLE IF NOT EXISTS keyspace1.adversarial (pk blob, ck blob, v blob, PRIMARY KEY (pk, ck)) WITH compaction = {'class': 'IncrementalCompactionStrategy'} AND tablets = {'min_tablet_count': '2', 'max_tablet_count': '2'};"

# One entry per cycle: stress_cmd[i] (writes) runs to completion, then stress_read_cmd[i].
stress_cmd:
  - &write_phase >-
    cassandra-stress user profile=/tmp/cs_compaction_controller_adversarial.yaml 'ops(insert=1)'
    no-warmup cl=ONE duration=15m
    -mode cql3 native
    -rate threads=200
    -pop 'dist=UNIFORM(1..50000)'
    -log interval=5
  - *write_phase
  - *write_phase
  - *write_phase
  - *write_phase
  - *write_phase
  - *write_phase
  - *write_phase

stress_read_cmd:
  - &read_phase >-
    cassandra-stress user profile=/tmp/cs_compaction_controller_adversarial.yaml 'ops(point_read=1)'
    no-warmup cl=ONE duration=15m
    -mode cql3 native
    -rate threads=400
    -pop 'dist=UNIFORM(1..50000)'
    -log interval=5
  - *read_phase
  - *read_phase
  - *read_phase
  - *read_phase
  - *read_phase
  - *read_phase
  - *read_phase

round_robin: true
