# Compaction controller comparison: write-heavy workload, controller v1.
#
# One of six jobs (3 workloads x 2 controllers) comparing the backlog-based
# controller (v1) with the rate-matching controller (v2). Scylla comes from a
# BYO build of raphaelsc/scylla branch v2-work-over-deadline (or the AMI
# baked from it); the controller is selected through scylla.yaml.
#
# Cluster: 1 DB node (i8g.large), RF 1, 1 loader, 1 monitor, no nemesis.
# A single node is enough: the controller is per shard. This is the 24 h variant
# of the 12 h job: the 2026-11-09 round showed the v2 busy shard still accumulating
# runs in pending tiers at hour 12 (9 -> 20 runs, normalized backlog 2 -> 21) with
# target == achieved, so 12 h was not long enough to see where that surplus goes,
# nor whether v1's integrator winds up. Same load as the 12 h job, only longer.
# Stress:
#   prepare: 25M rows of 1 KB written once (~25 GB, 1.5x the node's RAM; ~10 min at the
#            ~45K rows/s per node measured in the 12 h runs)
#   stress:  24 h of cassandra-stress mixed, 95% writes / 5% reads, NOT throttled, 200 threads
#            from a c6i.xlarge loader, uniform key distribution over the populated
#            range so reads miss cache.
#
# The query load must leave no spare capacity. Seastar's schedulers are work
# conserving: idle CPU or disk goes to compaction whatever shares the controller
# set, and then v1 and v2 are indistinguishable. 200 threads keep the reactors at
# 94-100% here, and the node is disk-bound as well: both controllers run near
# maximum shares, read p99 is 100-350 ms, and the controllers still differ on it
# (v2 traded write latency for read latency in the 2026-11-09 round), so the load
# stays unthrottled.
#
# Disk: the key range bounds the logical data, not the bytes on disk. Every
# overwrite is a new 1 KB version in a fresh run, and ICS discards the old version
# only when the runs holding both merge, which below the top tier almost never
# happens (a run covers a random 100K of the keys). So the live size settles at
# 6-8x the logical set plus the top-tier merge in flight: with 50M keys (50 GB) the
# i4i.large runs of 2026-11-09 reached 324 GB live at 28K writes/s, and i8g.large at
# 42K writes/s was at 320 GB live and 417 GB on the filesystem after 2.5 h, still
# rising, on a 468 GB NVMe. 25M keys halve the plateau (~150-225 GB live, peaks
# ~250 GB), and the plateau does not grow with the run length.
# Only ICS tables feed rates to controller v2, so the schema is ICS.

test_duration: 1500
test_metadata:
  description: >-
    Compaction controller comparison, write-heavy workload (95% writes / 5% reads) with
    controller v1 selected via scylla.yaml. BYO ScyllaDB build on a single small
    node, RF 1, ICS table, 25M-row population then 24 hours of unthrottled
    cassandra-stress mixed load with a uniform key distribution that keeps the DB CPUs saturated,
    so compaction only gets the CPU its shares allow. No nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: long
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: write

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i8g.large'
instance_type_loader: 'c6i.xlarge'

user_prefix: 'cc-write-heavy-v1-24h'

nemesis_class_name: 'NoOpMonkey'
# Scylla Manager is not used (no nemesis, no repair or backup). Off so setup does not
# depend on fetching its apt key from keyserver.ubuntu.com, which failed every build
# on 2026-11-11, and so no agent runs beside the reactor being measured.
use_mgmt: false

# Setting append_scylla_yaml replaces the default dict, so keep rf_rack_valid_keyspaces.
append_scylla_yaml:
  rf_rack_valid_keyspaces: true
  compaction_controller: v1
  # ICS compacts any tier of 2 runs when none holds min_threshold (4) runs unless this is
  # set, and both controllers count only the tiers at min_threshold. In the 12 h runs of
  # 2026-11-10 one shard stayed in that regime for the whole run: 1 TB compacted at a
  # controller target of 0, 23 to 68 MB/s of a disk the other shard had saturated, while
  # that other shard starved. Enforced here so both shards compact the same way and the
  # controllers see all the work the strategy does; the schema stays at the default 4.
  compaction_enforce_min_threshold: true
  # v1 reaches its maximum shares at a normalized backlog of this factor (backlog over
  # the shard's memory; default 30). This node is 468 GB over 16 GiB, 29:1, where the
  # tree never stages a backlog of 30x the memory; a 69:1 disk-to-memory node, the ratio
  # the controllers are designed for, sees 69/29 = 2.4x the normalized backlog for the
  # same share of its disk. 30 x 29 / 69 = 13 makes v1 react here as it does there,
  # the same factor in every v1 job of the comparison.
  compaction_normalization_factor: 13

# Scylla command line: the SCT defaults (setting append_scylla_args replaces them)
# plus debug logging of the compaction rate/controller logger, so the per-minute
# controller decisions are in the DB logs next to the metrics.
append_scylla_args: >-
  --blocked-reactor-notify-ms 25 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc
  --abort-on-internal-error 1 --abort-on-ebadf 1 --enable-sstable-key-validation 1
  --logger-log-level compaction_rates=debug

# One tablet replica per shard. i8g.large has 2 vCPUs, so 2 shards; one node with RF 1 gives
# 2 tablet replicas of ~12.5 GB each, one per shard.
# min/max_tablet_count pin the count, so the table growing past the 5 GB default
# tablet size never triggers a split, which would double the compaction groups
# the controller sees. cassandra-stress uses CREATE ... IF NOT EXISTS, so this
# pre-created schema wins over the one in its -schema option.
pre_create_keyspace:
  - "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1} AND tablets = {'initial': 2};"
  - "CREATE TABLE IF NOT EXISTS keyspace1.standard1 (key blob PRIMARY KEY, \"C0\" blob, \"C1\" blob, \"C2\" blob, \"C3\" blob) WITH compaction = {'class': 'IncrementalCompactionStrategy'} AND tablets = {'min_tablet_count': '2', 'max_tablet_count': '2'};"

prepare_write_cmd: >-
  cassandra-stress write no-warmup cl=ONE n=25000000
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=50
  -pop seq=1..25000000
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

stress_cmd: >-
  cassandra-stress mixed no-warmup cl=ONE duration=1440m 'ratio(write=19,read=1)'
  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1) compaction(strategy=IncrementalCompactionStrategy)'
  -mode cql3 native
  -rate threads=200
  -pop 'dist=UNIFORM(1..25000000)'
  -col 'n=FIXED(4) size=FIXED(256)'
  -log interval=5

round_robin: true
